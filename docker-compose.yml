version: '3.8'

services:
  sara-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: sara_backend_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
    env_file:
      - .env
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - sara_network

  sara-frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sara_frontend_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - sara_network

networks:
  sara_network:
    driver: bridge
